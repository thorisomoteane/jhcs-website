<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Abstract illustration of clean water delivery">
  <defs>
    <linearGradient id="w-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1d3a"/>
      <stop offset="55%" stop-color="#1a3a6b"/>
      <stop offset="100%" stop-color="#2f6fae"/>
    </linearGradient>
    <linearGradient id="w-drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="w-glow" cx="0.7" cy="0.4" r="0.55">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#w-bg)"/>
  <rect width="1600" height="900" fill="url(#w-glow)"/>

  <!-- main droplet -->
  <g transform="translate(1120 360)">
    <path d="M0 -190 C 108 -52 168 22 168 96 A 168 168 0 0 1 -168 96 C -168 22 -108 -52 0 -190 Z" fill="url(#w-drop)" opacity="0.92"/>
    <ellipse cx="-56" cy="70" rx="34" ry="46" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- ripples -->
  <g fill="none" stroke="#e0f2fe" stroke-linecap="round">
    <ellipse cx="1120" cy="628" rx="210" ry="46" stroke-width="7" opacity="0.4"/>
    <ellipse cx="1120" cy="628" rx="310" ry="70" stroke-width="5" opacity="0.26"/>
    <ellipse cx="1120" cy="628" rx="420" ry="96" stroke-width="4" opacity="0.15"/>
  </g>

  <!-- waves -->
  <path d="M0 720 q 140 -56 280 0 t 280 0 t 280 0 t 280 0 t 280 0 t 280 0 L1600 900 L0 900 Z" fill="#0b1d3a" opacity="0.45"/>
  <path d="M0 786 q 140 -56 280 0 t 280 0 t 280 0 t 280 0 t 280 0 t 280 0 L1600 900 L0 900 Z" fill="#0b1d3a" opacity="0.6"/>

  <!-- small droplets -->
  <g fill="#e0f2fe" opacity="0.45">
    <path d="M330 300 C 372 246 396 218 396 190 A 66 66 0 0 0 264 190 C 264 218 288 246 330 300 Z" transform="rotate(180 330 245)"/>
    <path d="M520 420 C 548 384 564 366 564 348 A 44 44 0 0 0 476 348 C 476 366 492 384 520 420 Z" transform="rotate(180 520 384)"/>
  </g>

  <!-- amber accent: the human element -->
  <g fill="#fbbf24" opacity="0.55">
    <circle cx="300" cy="600" r="36"/>
    <rect x="276" y="644" width="48" height="96" rx="24"/>
  </g>
  <rect x="358" y="640" width="96" height="104" rx="12" fill="#fbbf24" opacity="0.35"/>
</svg>

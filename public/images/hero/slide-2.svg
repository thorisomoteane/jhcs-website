<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Abstract illustration of shelter and housing">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1d3a"/>
      <stop offset="60%" stop-color="#1a3a6b"/>
      <stop offset="100%" stop-color="#31609f"/>
    </linearGradient>
    <linearGradient id="s-warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="s-glow" cx="0.68" cy="0.55" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#s-bg)"/>
  <rect width="1600" height="900" fill="url(#s-glow)"/>

  <!-- ground -->
  <path d="M0 700 L1600 640 L1600 900 L0 900 Z" fill="#0b1d3a" opacity="0.5"/>

  <!-- back row of roofs -->
  <g fill="#ffffff" opacity="0.12">
    <path d="M300 700 L470 540 L640 700 Z"/>
    <path d="M620 700 L790 540 L960 700 Z"/>
    <path d="M1300 690 L1440 560 L1580 690 Z"/>
  </g>

  <!-- main house -->
  <g transform="translate(1030 300)">
    <path d="M-260 260 L0 40 L260 260 Z" fill="url(#s-warm)"/>
    <rect x="-190" y="255" width="380" height="290" rx="14" fill="#ffffff" opacity="0.16"/>
    <!-- lit window: the point of the image -->
    <rect x="-70" y="330" width="140" height="140" rx="12" fill="#fbbf24" opacity="0.92"/>
    <line x1="0" y1="330" x2="0" y2="470" stroke="#1a3a6b" stroke-width="9"/>
    <line x1="-70" y1="400" x2="70" y2="400" stroke="#1a3a6b" stroke-width="9"/>
    <!-- door -->
    <rect x="-172" y="405" width="86" height="140" rx="10" fill="#ffffff" opacity="0.22"/>
  </g>

  <!-- sheltering arc -->
  <path d="M180 640 A 460 460 0 0 1 1100 640" fill="none" stroke="#fbbf24" stroke-width="9" opacity="0.35" stroke-linecap="round"/>
  <path d="M120 660 A 540 540 0 0 1 1160 660" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.16" stroke-linecap="round"/>

  <!-- figures -->
  <g fill="#ffffff" opacity="0.24">
    <circle cx="430" cy="640" r="34"/>
    <rect x="404" y="682" width="52" height="90" rx="26"/>
    <circle cx="540" cy="654" r="26"/>
    <rect x="520" y="686" width="40" height="72" rx="20"/>
  </g>
</svg>
